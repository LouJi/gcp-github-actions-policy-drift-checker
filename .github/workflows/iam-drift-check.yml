name: IAM Policy Drift Check

on:
  schedule:
    # 13:00 UTC = 8:00 AM CDT (San Antonio, TX during daylight saving).
    # GitHub Actions cron is always UTC and does NOT auto-adjust for DST,
    # so shift this by 1 hour when CDT/CST changes if you need a fixed local time.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation auth to GCP

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run IAM drift check
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python scripts/check_iam_drift.py
