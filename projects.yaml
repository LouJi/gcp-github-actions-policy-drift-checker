# List every resource whose IAM policy you want tracked.
# type: "project" | "folder" | "organization"
# id:   the project ID / folder numeric ID / org numeric ID
# policy_file: path (relative to repo root) to the desired-state JSON for that resource
#
# Start with one project like this:
projects:
  - type: project
    id: directed-advice-503122-d8
    policy_file: policies/my-project-1.json

# To track more later, just add entries:
#  - type: project
#    id: my-project-2
#    policy_file: policies/my-project-2.json
#  - type: folder
#    id: "123456789012"
#    policy_file: policies/folder-123456789012.json
